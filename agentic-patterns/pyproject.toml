[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-patterns"
version = "0.1.0"
description = "Small, composable reference implementations of the patterns from Anthropic's 'Building Effective Agents'."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agentic-patterns contributors" }]
keywords = ["llm", "agents", "workflows", "anthropic", "claude"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Only dependency is the LLM SDK itself — every pattern is otherwise stdlib.
dependencies = ["anthropic>=0.40.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/agentic-patterns"
Issues = "https://github.com/YOUR-USERNAME/agentic-patterns/issues"
Article = "https://www.anthropic.com/research/building-effective-agents"

[tool.setuptools.packages.find]
include = ["agentic_patterns*"]
